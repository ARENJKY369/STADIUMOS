services:
  - type: web
    name: stadium-backend
    env: node
    region: frankfurt
    branch: arena/019f7898-stadiumos
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stadium-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stadium-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLAUDE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://stadium-ops.vercel.app,https://ARENJKY369.github.io
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: stadium-ml
          property: host
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    healthCheckPath: /api/health

  - type: web
    name: stadium-ml
    env: python
    region: frankfurt
    branch: arena/019f7898-stadiumos
    rootDir: ml-models
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ML_API_KEY
        value: ml-service-internal-key
    healthCheckPath: /health

  - type: redis
    name: stadium-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: stadium-db
    region: frankfurt
    databaseName: stadium_ops
    user: stadium_user
    plan: free
