# FIFA World Cup 2026 - Stadium Operations AI Platform
# Production-ready multi-service orchestration
# One-command deployment: docker-compose up
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stadium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stadium_ops
      POSTGRES_USER: stadium_user
      POSTGRES_PASSWORD: stadium_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./backend/database/seeds:/seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stadium_user -d stadium_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stadium-network

  redis:
    image: redis:7-alpine
    container_name: stadium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stadium-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stadium-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://stadium_user:stadium_pass@postgres:5432/stadium_ops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-jwt-secret-key-min-64-chars-for-security-fifa2026
      JWT_REFRESH_SECRET: production-refresh-secret-key-min-64-chars-fifa
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGIN: http://localhost:3000,http://localhost:19006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - stadium-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ml-service:
    build:
      context: ./ml-models
      dockerfile: Dockerfile
    container_name: stadium-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ML_API_KEY: ml-service-internal-key
      MODEL_CACHE: /app/models
      NODE_ENV: production
    volumes:
      - ml_models:/app/models
      - ./ml-models/logs:/app/logs
    networks:
      - stadium-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stadium-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api/v1
      REACT_APP_SOCKET_URL: http://localhost:5000
      REACT_APP_ENV: production
    depends_on:
      - backend
    networks:
      - stadium-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s

  nginx:
    image: nginx:alpine
    container_name: stadium-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - stadium-network

  # Optional: Monitoring with Prometheus (commented for lightweight)
  # prometheus:
  #   image: prom/prometheus
  #   ports: ["9090:9090"]
  #   volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml"]
  #   networks: [stadium-network]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  ml_models:
    driver: local

networks:
  stadium-network:
    driver: bridge
    name: stadium-network
