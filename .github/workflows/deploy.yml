name: CD - Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/stadium-backend:$GITHUB_SHA -f backend/Dockerfile backend
          docker push $ECR_REGISTRY/stadium-backend:$GITHUB_SHA
          docker tag $ECR_REGISTRY/stadium-backend:$GITHUB_SHA $ECR_REGISTRY/stadium-backend:latest
          docker push $ECR_REGISTRY/stadium-backend:latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/stadium-frontend:$GITHUB_SHA -f frontend/Dockerfile frontend
          docker push $ECR_REGISTRY/stadium-frontend:$GITHUB_SHA
          docker tag $ECR_REGISTRY/stadium-frontend:$GITHUB_SHA $ECR_REGISTRY/stadium-frontend:latest
          docker push $ECR_REGISTRY/stadium-frontend:latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Build and push ML
        run: |
          docker build -t $ECR_REGISTRY/stadium-ml:$GITHUB_SHA -f ml-models/Dockerfile ml-models
          docker push $ECR_REGISTRY/stadium-ml:$GITHUB_SHA
          docker tag $ECR_REGISTRY/stadium-ml:$GITHUB_SHA $ECR_REGISTRY/stadium-ml:latest
          docker push $ECR_REGISTRY/stadium-ml:latest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > ec2.pem && chmod 400 ec2.pem
          ssh -o StrictHostKeyChecking=no -i ec2.pem ec2-user@$EC2_HOST << 'EOF'
            cd /opt/stadium-ops
            docker-compose pull
            docker-compose up -d --no-deps backend frontend ml-service
            docker system prune -f
            curl -f http://localhost:5000/api/health || exit 1
            echo "Deployment successful"
          EOF

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

      - name: Notify Slack
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment ${{ job.status }} for commit ${{ github.sha }}"}' ${{ secrets.SLACK_WEBHOOK_URL }} || true
